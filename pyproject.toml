[project]
name = "lockedin"
version = "0.1.0"
description = "A fast, reliable solver for LinkedIn daily games. Powered by TechZech"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lockedin = "lockedin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]